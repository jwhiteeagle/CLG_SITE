# .github/dependabot.yml
# Minor/patch bumps are grouped into one weekly PR per ecosystem and
# auto-merged by .github/workflows/dependabot-auto-merge.yml once CI passes.
# Majors open as separate PRs for manual review.
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    # Majors held back on purpose: TS 7 lacks the JS API typescript-eslint needs;
    # @types/node should match the Node version CI runs (24). Revisit together.
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
